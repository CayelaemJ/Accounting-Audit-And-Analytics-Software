name: CABO Financial Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/cabo-financial-intelligence-foundation]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d cabo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cabo_app:dev-test-password@127.0.0.1:5432/cabo_test
      BANK_SOURCE_HMAC_KEY: "abababababababababababababababababababababababababababababababab" # fixed test-only fixture, never use in production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Configure PostgreSQL least-privileged test role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "CREATE ROLE cabo_app LOGIN PASSWORD 'dev-test-password' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "GRANT CREATE ON DATABASE cabo_test TO cabo_app"
          psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "GRANT CREATE, USAGE ON SCHEMA public TO cabo_app"
      - name: Apply schema
        run: npm run db:migrate
      - name: PostgreSQL accounting and RLS integration tests
        run: npm run test:db
      - name: Production Next.js build
        run: npm run build
      - name: End-to-end HTTP and superadmin authentication smoke
        run: |
          PORT=3123 npm start > /tmp/cabo-next.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          npm run test:http || { tail -n 70 /tmp/cabo-next.log; exit 1; }
