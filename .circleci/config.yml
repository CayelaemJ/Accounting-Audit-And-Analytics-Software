version: 2.1
jobs:
  financial_quality:
    docker:
      - image: cimg/node:22.16
      - image: postgres:16
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cabo_test
    resource_class: medium
    environment:
      DATABASE_URL: postgresql://cabo_app:dev-test-password@127.0.0.1:5432/cabo_test
      BANK_SOURCE_HMAC_KEY: "abababababababababababababababababababababababababababababababab"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - checkout
      - run:
          name: Install dependencies (lockfile not yet tracked)
          command: npm install --no-audit --no-fund
      - run:
          name: TypeScript and financial regression tests
          command: |
            mkdir -p test-results
            npm run typecheck
            npm run test:ci
      - run:
          name: Provision disposable non-superuser PostgreSQL fixture
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
            export PGPASSWORD=postgres
            for i in $(seq 1 30); do
              pg_isready -h 127.0.0.1 -U postgres -d cabo_test && break
              sleep 1
            done
            psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "CREATE ROLE cabo_app LOGIN PASSWORD 'dev-test-password' NOSUPERUSER NOBYPASSRLS"
            psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "GRANT CREATE ON DATABASE cabo_test TO cabo_app"
            psql -h 127.0.0.1 -U postgres -d cabo_test -v ON_ERROR_STOP=1 -c "GRANT CREATE, USAGE ON SCHEMA public TO cabo_app"
            npm run db:migrate
      - run:
          name: Accounting integrity and row-level isolation
          command: node --import tsx --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=test-results/database.xml tests/database.test.ts tests/operations.test.ts
      - run:
          name: Production Next.js build
          command: npm run build
      - run:
          name: Local HTTP application smoke
          command: |
            PORT=3123 npm start > /tmp/cabo-next.log 2>&1 &
            PID=$!
            trap 'kill "$PID" || true' EXIT
            npm run test:http || { tail -n 70 /tmp/cabo-next.log; exit 1; }
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

  security_suite:
    docker:
      - image: cimg/go:1.24
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install Python runtime and prerequisites
          command: |
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv curl
            python3 -m venv "$HOME/security-venv"
            echo 'export PATH="$HOME/security-venv/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Semgrep, Gitleaks, Trivy, optional Nuclei and Schemathesis
          command: bash .circleci/security.sh
          no_output_timeout: 15m
      - store_artifacts:
          path: security-reports
          destination: security-reports
  zap_baseline:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Require approved staging target
          command: |
            if [ "${SECURITY_ZAP_APPROVED:-}" != "YES_STAGING_ONLY" ] || [ -z "${SECURITY_ZAP_TARGET_URL:-}" ]; then
              echo "ZAP skipped until approved staging URL is provided"
              circleci-agent step halt
            fi
            case "$SECURITY_ZAP_TARGET_URL" in
              https://*staging*|https://*test*|https://*preview*) ;;
              *) echo "Staging/test/preview HTTPS target required"; exit 2;;
            esac
      - setup_remote_docker
      - run:
          name: OWASP ZAP passive baseline
          command: docker run --rm ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$SECURITY_ZAP_TARGET_URL" -m 1 -I
          no_output_timeout: 15m

workflows:
  financial_regressions:
    jobs:
      - financial_quality
  security_audit:
    jobs:
      - zap_baseline:
          filters:
            branches:
              only: main
      - security_suite
